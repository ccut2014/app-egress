name: Release

# Push a tag like v1.2.0 to build, package and publish a draft GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $v = $env:RELEASE_TAG.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Invalid release version' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Fetch and verify WinDivert
        shell: pwsh
        run: ./scripts/get-windivert.ps1

      - name: Publish lightweight package and corresponding source
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:APP_VERSION

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/AppEgress-${{ steps.version.outputs.version }}-win-x64.zip
            dist/AppEgress-${{ steps.version.outputs.version }}-source.zip
            dist/SHA256SUMS.txt
